services:
  - type: web
    name: signal-sense-api
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-sense-db
          property: connectionString
      - key: PORT
        value: "8080"
  
databases:
  - name: signal-sense-db
    plan: free
    databaseName: signalsense
    user: signalsense_user
