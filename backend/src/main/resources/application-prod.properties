spring.application.name=signal-sense-backend

# PostgreSQL Database settings for Production
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
# Render injects DATABASE_URL in the format postgres://user:pass@host:port/dbname
# Spring Boot can usually parse this, or you can provide SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD manually if needed.

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl-auto: validate or update (update is okay for MVP)
spring.jpa.hibernate.ddl-auto=update

# Server Port
server.port=${PORT:8080}
